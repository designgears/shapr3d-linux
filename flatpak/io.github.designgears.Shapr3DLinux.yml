# Shapr3D for Linux, built in the freedesktop 25.08 SDK. flatpak/build.sh builds it (and prepares .build/ first) and
# exports the .flatpak; appimage/build.sh packs the same build as the AppImage, which is why both run on glibc 2.38.
#
# Wine is built here from the upstream release tarball with our Wine source (wine/ in the wine-uwp repo, every file we
# changed, in full) laid over it; configure is regenerated because configure.ac is one of those files. Nothing of
# Microsoft's is in it: the setup downloads Windows components on the user's machine.
app-id: io.github.designgears.Shapr3DLinux
# the plain freedesktop runtime: the installer draws its own UI (Slint), so no GNOME/GTK
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.mingw-w64
  - org.freedesktop.Sdk.Extension.rust-stable
command: wine-uwp
finish-args:
  - --share=ipc
  - --share=network
  # Wine draws through X11 (run.sh pins the x11 driver); on Wayland desktops this is Xwayland
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  # where Shapr3D's open/save dialogs start (the prefix's Documents/Desktop/Pictures/Downloads point here)
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=xdg-desktop
  - --filesystem=xdg-pictures
  - --env=WINEDEBUG=-all,err+all
cleanup:
  - /include
  - /share/man
  - /share/applications/wine.desktop
  - /bin/function_grep.pl
  - /bin/widl
  - /bin/winebuild
  - /bin/winecpp
  - /bin/winedump
  - /bin/wineg++
  - /bin/winegcc
  - /bin/winemaker
  - /bin/wmc
  - /bin/wrc
  - '*.a'
modules:
  # 7-Zip reads the Windows ISO (UDF) and its install.wim for the harvest
  - name: 7zip
    buildsystem: simple
    build-commands:
      - make -C CPP/7zip/Bundles/Alone2 -f makefile.gcc -j${FLATPAK_BUILDER_N_JOBS}
      - install -Dm755 CPP/7zip/Bundles/Alone2/_o/7zz /app/bin/7zz
    sources:
      - type: archive
        url: https://github.com/ip7z/7zip/releases/download/26.03/7z2603-src.tar.xz
        sha256: 9cbde5099c6deb73691b0579063da5827522ccbbcba3f0020fd04e8c8c16c0d4
        strip-components: 0

  - name: wine
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/mingw-w64/bin
      no-debuginfo: true
      env:
        # the PE side (mingw); no debug info keeps the 2,000-odd modules small
        CROSSCFLAGS: -O2
    build-commands:
      - rm -f FILES BASE.txt
      - autoreconf -f
      - >-
        ./configure --prefix=/app --enable-archs=x86_64 --disable-tests
        --without-oss --without-pcap --without-opencl --without-cups --without-sane --without-gphoto
        --without-capi --without-v4l2 --without-netapi --without-pcsclite
      - make -j${FLATPAK_BUILDER_N_JOBS}
      - make install
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/source/11.x/wine-11.17.tar.xz
        sha256: 8e752e29bba2901ad9f915139345c6ee67184b099d425704d915971ca5c055fc
      # our Wine source over it (wine/FILES lists every file; wine/BASE.txt names the base)
      - type: dir
        path: .build/wine

  # the setup: Rust + Slint (installer/ in this repo). Crates come from crates.io at build time, pinned by Cargo.lock.
  - name: installer
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/installer/cargo
    build-commands:
      - cargo build --release --locked
      - install -Dm755 target/release/wine-uwp-installer /app/bin/wine-uwp-installer
    sources:
      - type: dir
        path: ../installer
        skip:
          - target

  - name: wine-uwp
    buildsystem: simple
    build-commands:
      - cp -r share/wine-uwp /app/share/
      - install -Dm755 bin/wine-uwp /app/bin/wine-uwp
      - install -Dm644 io.github.designgears.Shapr3DLinux.desktop /app/share/applications/io.github.designgears.Shapr3DLinux.desktop
      - install -Dm644 io.github.designgears.Shapr3DLinux.metainfo.xml /app/share/metainfo/io.github.designgears.Shapr3DLinux.metainfo.xml
      - install -Dm644 io.github.designgears.Shapr3DLinux.svg /app/share/icons/hicolor/scalable/apps/io.github.designgears.Shapr3DLinux.svg
    sources:
      # wine-uwp's packaging/build-dist.sh --no-wine: the scripts and our shim DLLs
      - type: dir
        path: .build/dist
      - type: file
        path: io.github.designgears.Shapr3DLinux.desktop
      - type: file
        path: io.github.designgears.Shapr3DLinux.metainfo.xml
      - type: file
        path: io.github.designgears.Shapr3DLinux.svg
